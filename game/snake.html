<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>贪吃蛇</title>
	<style>/*网站设置*/
		:root {
			color-scheme: dark;
			font-family: Arial, sans-serif;
		}

		body {
			align-items: center;
			background: #090d12;
			display: flex;
			justify-content: center;
			margin: 0;
			min-height: 100vh;
		}

		.game {
			text-align: center;
			width: min(100% - 32px, 520px);
		}

		h1 {
			color: #f3f4f6;
			font-size: 28px;
			margin: 0 0 12px;
		}

		.scoreboard {
			display: grid;
			gap: 12px;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			margin: 0 auto 14px;
			text-align: left;
		}

		.score-panel {
			background: #111827;
			border: 1px solid #374151;
			border-radius: 8px;
			padding: 14px 16px;
		}

		.score-panel h2 {
			color: #e5e7eb;
			font-size: 15px;
			margin: 0 0 10px;
		}

		.score-line {
			color: #d1d5db;
			font-size: 16px;
			line-height: 1.7;
		}

		.score-line strong {
			color: #facc15;
			font-size: 20px;
		}

		.status {
			color: #86efac;
			font-size: 16px;
			margin-bottom: 12px;
		}

		.ai-status {
			color: #93c5fd;
			font-size: 14px;
			margin: 0 0 12px;
		}

		canvas {
			background: #111827;
			border: 2px solid #374151;
			display: block;
			height: 400px;
			width: 400px;
		}

		.controls {
			display: flex;
			gap: 8px;
			justify-content: center;
			margin-top: 14px;
		}

		.controls button {
			margin: 0;
		}

		.restart-button {
			background: #16a34a;
			border: 0;
			border-radius: 6px;
			color: #ffffff;
			cursor: pointer;
			font-size: 15px;
			margin-top: 14px;
			padding: 9px 18px;
		}

		.restart-button:hover {
			background: #22c55e;
		}

		.reset-button {
			background: #374151;
			border: 0;
			border-radius: 6px;
			color: #e5e7eb;
			cursor: pointer;
			font-size: 14px;
			padding: 9px 18px;
		}

		.reset-button:hover {
			background: #4b5563;
		}

		.ai-button {
			background: #2563eb;
			border: 0;
			border-radius: 6px;
			color: #ffffff;
			cursor: pointer;
			font-size: 15px;
			margin-top: 14px;
			padding: 9px 18px;
		}

		.ai-button:hover {
			background: #3b82f6;
		}

		.hint {
			color: #9ca3af;
			font-size: 14px;
			margin-top: 12px;
		}

		.history-button {
			background: #7c3aed;
			border: 0;
			border-radius: 6px;
			color: #ffffff;
			cursor: pointer;
			font-size: 14px;
			margin-top: 14px;
			padding: 9px 18px;
		}

		.history-button:hover {
			background: #8b5cf6;
		}

		.history-panel {
			background: #111827;
			border: 1px solid #374151;
			border-radius: 8px;
			margin-top: 12px;
			overflow: hidden;
			padding: 12px;
			text-align: left;
		}

		.history-panel[hidden] {
			display: none;
		}

		.history-table {
			border-collapse: collapse;
			color: #d1d5db;
			font-size: 14px;
			width: 100%;
		}

		.history-table th,
		.history-table td {
			border-bottom: 1px solid #374151;
			padding: 8px 6px;
			text-align: left;
		}

		.history-table th {
			color: #93c5fd;
			font-weight: 600;
		}

		.history-table tr:last-child td {
			border-bottom: 0;
		}

		.history-win {
			color: #86efac;
		}

		.history-loss {
			color: #fca5a5;
		}

		.empty-history {
			color: #9ca3af;
			font-size: 14px;
			margin: 4px 0;
			text-align: center;
		}
	</style>
	<title>主题切换示例</title>
<style>
    /* ========== 深色主题（默认） ========== */
    :root,
    [data-theme="dark"] {
        --bg:          #1a1a2e;
        --panel-bg:    #16213e;
        --text:        #eaeaea;
        --text-sub:    #a0a0b0;
        --accent:      #e94560;
        --border:      #2a2a4a;
        --btn-bg:      #0f3460;
        --btn-hover:   #1a4a7a;
        --shadow:      0 4px 12px rgba(0, 0, 0, 0.4);
    }

    /* ========== 浅色主题 ========== */
    [data-theme="light"] {
        --bg:          #f5f5f7;
        --panel-bg:    #ffffff;
        --text:        #1a1a2e;
        --text-sub:    #666677;
        --accent:      #007bff;
        --border:      #e0e0e5;
        --btn-bg:      #007bff;
        --btn-hover:   #0060cc;
        --shadow:      0 4px 12px rgba(0, 0, 0, 0.1);
    }

    /* ========== 全局样式 ========== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 40px 20px;
        /* 切换时的平滑过渡 */
        transition: background 0.3s ease, color 0.3s ease;
    }

    .panel {
        background: var(--panel-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 32px 40px;
        box-shadow: var(--shadow);
        text-align: center;
        min-width: 320px;
        transition: background 0.3s ease, border-color 0.3s ease,
                    box-shadow 0.3s ease;
    }

    h1 {
        font-size: 24px;
        margin-bottom: 12px;
        color: var(--accent);
        transition: color 0.3s ease;
    }

    p {
        color: var(--text-sub);
        font-size: 14px;
        margin-bottom: 24px;
        transition: color 0.3s ease;
    }

    /* ========== 按钮样式 ========== */
    button {
        font-family: inherit;
        font-size: 15px;
        padding: 10px 24px;
        border: none;
        border-radius: 8px;
        background: var(--btn-bg);
        color: #ffffff;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
        background: var(--btn-hover);
    }

    button:active {
        transform: scale(0.97);
    }

    /* 主题切换按钮特殊样式 */
    #theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    /* 当前主题指示 */
    .theme-label {
        font-size: 13px;
        color: var(--text-sub);
        margin-top: 16px;
        transition: color 0.3s ease;
    }
</style>
</head>
<body>

    <div class="panel">
        <h1>主题切换演示</h1>
        <p>点击下方按钮切换深色 / 浅色主题，刷新后仍会保留你的选择。</p>

        <button id="theme-toggle">
            <span id="theme-icon">🌙</span>
            <span id="theme-text">切换到浅色</span>
        </button>

        <div class="theme-label">
            当前主题：<b id="current-theme">深色</b>
        </div>
    </div>

<script>
    // ============================================================
    //  主题切换逻辑
    // ============================================================

    // 主题配置：键名对应 data-theme 的值
    const THEMES = {
        dark:  { icon: '🌙', label: '深色', buttonText: '切换到浅色', next: 'light' },
        light: { icon: '☀️', label: '浅色', buttonText: '切换到深色', next: 'dark'  }
    };

    // DOM 元素引用
    const toggleBtn    = document.getElementById('theme-toggle');
    const themeIcon    = document.getElementById('theme-icon');
    const themeText    = document.getElementById('theme-text');
    const currentLabel = document.getElementById('current-theme');

    /**
     * 应用指定主题
     * @param {string} theme - 'dark' 或 'light'
     */
    function applyTheme(theme) {
        // 1. 在 <html> 上设置 data-theme 属性，CSS 变量会自动切换
        document.documentElement.setAttribute('data-theme', theme);

        // 2. 更新按钮和标签的显示
        const config = THEMES[theme];
        themeIcon.textContent    = config.icon;
        themeText.textContent    = config.buttonText;
        currentLabel.textContent = config.label;

        // 3. 保存到 localStorage，刷新后可以恢复
        localStorage.setItem('theme', theme);
    }

    /**
     * 切换主题
     */
    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = THEMES[current].next;
        applyTheme(next);
    }

    /**
     * 页面加载时恢复上次选择的主题
     */
    function initTheme() {
        // 优先读取 localStorage，没有则默认深色
        const saved = localStorage.getItem('theme');
        const theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
        applyTheme(theme);
    }

    // 绑定事件
    toggleBtn.addEventListener('click', toggleTheme);

    // 初始化
    initTheme();
</script>

</body>
</html>

<body>
	<main class="game">
		<h1>贪吃蛇</h1>
		<div class="scoreboard">
			<section class="score-panel" aria-label="玩家记录">
				<h2>玩家记录</h2>
				<div class="score-line">当前得分：<strong id="score">0</strong></div>
				<div class="score-line">历史最高分：<strong id="highScore">0</strong></div>
			</section>
			<section class="score-panel" aria-label="AI演示记录">
				<h2>AI演示</h2>
				<div class="score-line">已吃食物：<strong id="foodCount">0</strong></div>
				<div class="score-line">AI最高数量：<strong id="aiHighScore">0</strong></div>
			</section>
		</div>
		<div class="status" id="status">游戏进行中</div>
		<canvas id="gameCanvas" width="400" height="400" aria-label="贪吃蛇游戏画布"></canvas>
		<div class="controls">
			<button class="restart-button" id="restartButton" type="button">重新开始</button>
			<button class="reset-button" id="resetButton" type="button">重置玩家记录</button>
			<button class="ai-button" id="aiButton" type="button">AI演示</button>
		</div>
		<button class="history-button" id="historyButton" type="button" aria-expanded="false">查看战绩</button>
		<section class="history-panel" id="historyPanel" aria-label="最近10局战绩" hidden>
			<table class="history-table">
				<thead>
					<tr><th>局次</th><th>得分</th><th>结果</th><th>时间</th></tr>
				</thead>
				<tbody id="historyList"></tbody>
			</table>
			<p class="empty-history" id="emptyHistory">暂无战绩</p>
		</section>
		<div class="hint">请按键盘方向键移动蛇，游戏结束后按空格键重新开始</div>
	</main>

	<script>
		const canvas = document.getElementById('gameCanvas');
		const context = canvas.getContext('2d');
		const scoreElement = document.getElementById('score');
		const foodCountElement = document.getElementById('foodCount');
		const highScoreElement = document.getElementById('highScore');
		const aiHighScoreElement = document.getElementById('aiHighScore');
		const statusElement = document.getElementById('status');
		const restartButton = document.getElementById('restartButton');
		const resetButton = document.getElementById('resetButton');
		const aiButton = document.getElementById('aiButton');
		const historyButton = document.getElementById('historyButton');
		const historyPanel = document.getElementById('historyPanel');
		const historyList = document.getElementById('historyList');
		const emptyHistory = document.getElementById('emptyHistory');
		const gridSize = 20;
		const tileCount = canvas.width / gridSize;
		const gameSpeed = 150;
		const highScoreStorageKey = 'snakeHighScore';
		const aiHighScoreStorageKey = 'snakeAiHighScore';
		const gameHistoryStorageKey = 'snakeGameHistory';
		const movementDirections = [
			{ x: 0, y: -1 },
			{ x: 1, y: 0 },
			{ x: 0, y: 1 },
			{ x: -1, y: 0 }
		];

		let snake;
		let direction;
		let nextDirection;
		let food;
		let score;
		let highScore = Number.parseInt(localStorage.getItem(highScoreStorageKey), 10) || 0;
		let aiHighScore = Number.parseInt(localStorage.getItem(aiHighScoreStorageKey), 10) || 0;
		let gameOver;
		let gameTimer;
		let aiMode = false;
		let gameHistory = loadGameHistory();

		highScoreElement.textContent = highScore;
		aiHighScoreElement.textContent = aiHighScore;
		renderGameHistory();

		function loadGameHistory() {
			try {
				const savedHistory = JSON.parse(localStorage.getItem(gameHistoryStorageKey) || '[]');
				return Array.isArray(savedHistory) ? savedHistory.slice(0, 10) : [];
			} catch (error) {
				return [];
			}
		}

		function saveGameHistory(result) {
			gameHistory.unshift({
				score,
				result,
				time: new Date().toLocaleString('zh-CN', { hour12: false })
			});
			gameHistory = gameHistory.slice(0, 10);
			localStorage.setItem(gameHistoryStorageKey, JSON.stringify(gameHistory));
			renderGameHistory();
		}

		function renderGameHistory() {
			historyList.innerHTML = gameHistory.map((record, index) => `
				<tr>
					<td>${index + 1}</td>
					<td>${record.score}</td>
					<td class="${record.result === '胜' ? 'history-win' : 'history-loss'}">${record.result}</td>
					<td>${record.time}</td>
				</tr>
			`).join('');
			emptyHistory.hidden = gameHistory.length > 0;
		}

		function startGame() {
            // 1. 重置蛇到初始位置
			snake = [
				{ x: 11, y: 10 },
				{ x: 10, y: 10 },
				{ x: 9, y: 10 }
			];
            // 2. 方向设为向右
			direction = { x: 1, y: 0 };
			nextDirection = { x: 1, y: 0 };
			score = 0;
			gameOver = false;
			if (aiMode) {
				foodCountElement.textContent = score;
				statusElement.textContent = 'AI演示进行中';
				statusElement.style.color = '#93c5fd';
			} else {
				scoreElement.textContent = score;
				statusElement.textContent = '游戏进行中';
				statusElement.style.color = '#86efac';
			}
			aiButton.textContent = aiMode ? '停止AI演示' : 'AI演示';
			placeFood();
			clearInterval(gameTimer);
			gameTimer = setInterval(updateGame, gameSpeed);
			drawGame();
		}

		function placeFood() {
			do {
				food = {
					x: Math.floor(Math.random() * tileCount),//生成随机数
					y: Math.floor(Math.random() * tileCount)
				};
			} while (snake.some((segment) => segment.x === food.x && segment.y === food.y));
		}//食物与蛇身重叠时重新生成食物位置

		function updateGame() {
			if (gameOver) {
				return;//游戏结束时不再更新游戏状态
			}

			if (aiMode) {
				nextDirection = chooseSafeAiDirection();
			}

			direction = nextDirection;
			const head = {
				x: snake[0].x + direction.x,
				y: snake[0].y + direction.y
			};
            // 检查蛇是否撞墙或撞到自己
			const hitsWall = head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount;
			const eatsFood = head.x === food.x && head.y === food.y;
			const bodyToCheck = eatsFood ? snake : snake.slice(0, -1);
			const hitsSelf = bodyToCheck.some((segment) => segment.x === head.x && segment.y === head.y);

			if (hitsWall || hitsSelf) {
				endGame();
				return;
			}

			snake.unshift(head);

			if (eatsFood) {
				score += 1;
				if (aiMode) {
					foodCountElement.textContent = score;
				} else {
					scoreElement.textContent = score;
				}
				if (snake.length === tileCount * tileCount) {
					endGame('胜');
					return;
				}
				placeFood();
			} else {
				snake.pop();
			}

			drawGame();
		}

		function chooseSafeAiDirection() {
			const legalDirections = getLegalDirections();
			const safeDirections = legalDirections.filter((step) => canReachTail(simulateMove(step)));
			const foodPath = findPathToFood();
			const foodDirection = foodPath[0];
			const safeFoodDirection = safeDirections.find((step) => sameDirection(step, foodDirection));

			if (safeFoodDirection) {
				return safeFoodDirection;
			}

			if (safeDirections.length > 0) {
				return safeDirections.sort((first, second) =>
					manhattanDistance(getNextHead(first), food) - manhattanDistance(getNextHead(second), food)
				)[0];
			}

			return legalDirections[0] || nextDirection;
		}

		function getLegalDirections() {
			return movementDirections.filter((step) => {
				const isReverse = step.x + direction.x === 0 && step.y + direction.y === 0;
				const nextHead = getNextHead(step);
				const outsideBoard = nextHead.x < 0 || nextHead.x >= tileCount || nextHead.y < 0 || nextHead.y >= tileCount;
				const eatsFood = nextHead.x === food.x && nextHead.y === food.y;
				const bodyToCheck = eatsFood ? snake : snake.slice(0, -1);
				const hitsSelf = bodyToCheck.some((segment) => segment.x === nextHead.x && segment.y === nextHead.y);

				return !isReverse && !outsideBoard && !hitsSelf;
			});
		}

		function getNextHead(step) {
			return { x: snake[0].x + step.x, y: snake[0].y + step.y };
		}

		function simulateMove(step) {
			const nextHead = getNextHead(step);
			const eatsFood = nextHead.x === food.x && nextHead.y === food.y;
			return eatsFood ? [nextHead, ...snake] : [nextHead, ...snake.slice(0, -1)];
		}

		function canReachTail(simulatedSnake) {
			if (simulatedSnake.length <= 1) {
				return true;
			}

			const target = simulatedSnake[simulatedSnake.length - 1];
			const queue = [{ x: simulatedSnake[0].x, y: simulatedSnake[0].y }];
			const visited = new Set([`${simulatedSnake[0].x},${simulatedSnake[0].y}`]);
			const body = simulatedSnake.slice(1, -1);

			while (queue.length > 0) {
				const current = queue.shift();
				if (current.x === target.x && current.y === target.y) {
					return true;
				}

				for (const step of movementDirections) {
					const next = { x: current.x + step.x, y: current.y + step.y };
					const key = `${next.x},${next.y}`;
					const outsideBoard = next.x < 0 || next.x >= tileCount || next.y < 0 || next.y >= tileCount;
					const hitsBody = body.some((segment) => segment.x === next.x && segment.y === next.y);

					if (!outsideBoard && !hitsBody && !visited.has(key)) {
						visited.add(key);
						queue.push(next);
					}
				}
			}

			return false;
		}

		function manhattanDistance(first, second) {
			return Math.abs(first.x - second.x) + Math.abs(first.y - second.y);
		}

		function sameDirection(first, second) {
			return first && second && first.x === second.x && first.y === second.y;
		}

		function findPathToFood() {
			const queue = [{ x: snake[0].x, y: snake[0].y, path: [] }];
			const visited = new Set([`${snake[0].x},${snake[0].y}`]);
			const body = snake.slice(1, -1);

			while (queue.length > 0) {
				const current = queue.shift();
				if (current.x === food.x && current.y === food.y) {
					return current.path;
				}

				for (const step of movementDirections) {
					const next = { x: current.x + step.x, y: current.y + step.y };
					const key = `${next.x},${next.y}`;
					const outsideBoard = next.x < 0 || next.x >= tileCount || next.y < 0 || next.y >= tileCount;
					const hitsSnake = body.some((segment) => segment.x === next.x && segment.y === next.y);

					if (!outsideBoard && !hitsSnake && !visited.has(key)) {
						visited.add(key);
						queue.push({ x: next.x, y: next.y, path: [...current.path, step] });
					}
				}
			}

			return [];
		}

		function drawGame() {
			context.fillStyle = '#111827';
			context.fillRect(0, 0, canvas.width, canvas.height);

			context.strokeStyle = '#1f2937';
			context.lineWidth = 1;
			for (let line = 1; line < tileCount; line += 1) {
				const position = line * gridSize + 0.5;
				context.beginPath();
				context.moveTo(position, 0);
				context.lineTo(position, canvas.height);
				context.stroke();
				context.beginPath();
				context.moveTo(0, position);
				context.lineTo(canvas.width, position);
				context.stroke();
			}

			context.shadowColor = '#ef4444';
			context.shadowBlur = 12;
			context.fillStyle = '#ef4444';
			context.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 2, gridSize - 2);
			context.shadowBlur = 0;

			snake.forEach((segment, index) => {
				const gradient = context.createLinearGradient(
					segment.x * gridSize,
					segment.y * gridSize,
					segment.x * gridSize + gridSize,
					segment.y * gridSize + gridSize
				);
				gradient.addColorStop(0, index === 0 ? '#86efac' : '#4ade80');
				gradient.addColorStop(1, index === 0 ? '#16a34a' : '#15803d');
				context.fillStyle = gradient;
				context.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
			});

			if (gameOver) {
				statusElement.textContent = '游戏结束';
				statusElement.style.color = '#f87171';
				context.fillStyle = 'rgba(17, 24, 39, 0.78)';
				context.fillRect(0, 0, canvas.width, canvas.height);
				context.fillStyle = '#ffffff';
				context.font = 'bold 28px Arial';
				context.textAlign = 'center';
				context.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 10);
				context.font = '16px Arial';
				context.fillText('按空格键重新开始', canvas.width / 2, canvas.height / 2 + 25);
			}
		}

		function endGame(result = '负') {
			gameOver = true;
			clearInterval(gameTimer);
			if (!aiMode) {
				saveGameHistory(result);
			}
			if (aiMode) {
				if (score > aiHighScore) {
					aiHighScore = score;
					localStorage.setItem(aiHighScoreStorageKey, aiHighScore);
					aiHighScoreElement.textContent = aiHighScore;
				}
			} else if (score > highScore) {
				highScore = score;
				localStorage.setItem(highScoreStorageKey, highScore);
				highScoreElement.textContent = highScore;
			}
			drawGame();
		}

		restartButton.addEventListener('click', startGame);
		aiButton.addEventListener('click', () => {
			aiMode = !aiMode;
			aiButton.textContent = aiMode ? '停止AI演示' : 'AI演示';
			startGame();
		});
		resetButton.addEventListener('click', () => {
			localStorage.removeItem(highScoreStorageKey);
			localStorage.removeItem(gameHistoryStorageKey);
			highScore = 0;
			gameHistory = [];
			highScoreElement.textContent = highScore;
			renderGameHistory();
		});
		historyButton.addEventListener('click', () => {
			const isExpanded = historyPanel.hidden;
			historyPanel.hidden = !isExpanded;
			historyButton.textContent = isExpanded ? '收起战绩' : '查看战绩';
			historyButton.setAttribute('aria-expanded', String(isExpanded));
		});

		document.addEventListener('keydown', (event) => {
			const keyDirections = {
				ArrowUp: { x: 0, y: -1 },
				ArrowDown: { x: 0, y: 1 },
				ArrowLeft: { x: -1, y: 0 },
				ArrowRight: { x: 1, y: 0 }
			};

			if (event.code === 'Space' && gameOver) {
				event.preventDefault();
				startGame();
				return;
			}

			const newDirection = keyDirections[event.key];
			if (!newDirection) {
				return;
			}

			event.preventDefault();
			const isReverse = newDirection.x + direction.x === 0 && newDirection.y + direction.y === 0;
			if (!isReverse) {
				nextDirection = newDirection;
			}
		});

		startGame();
	</script>
</body>
</html>
